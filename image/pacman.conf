# Package sources for the Kettle Linux rootfs: Valve's SteamOS "deckard" (Steam Frame)
# aarch64 repos. mash-20240428.1 is the base the release-0.4 hotfix binaries link against
# (ICU 74, x265 3.5); mash-20240705.2 fails to resolve gamescope -> freerdp -> ffmpeg.
# Used both at build time (host pacman --root) and installed as the image's /etc/pacman.conf.

[options]
HoldPkg      = pacman glibc
Architecture = aarch64
CheckSpace
ParallelDownloads = 8
# Nothing in Valve's deckard repos is signed; integrity comes from HTTPS + pinned snapshots.
SigLevel          = Never
LocalFileSigLevel = Never
# Frame-only kernels/bootloaders; we ship our own kernel
IgnorePkg = linux-72-deckard linux-72-deckard-headers linux-618-deckard linux-617-deckard linux-616-deckard deckard-linux-6.16 linux-firmware-deckard deckard-uboot deckard-uboot-bootwrapper deckard-uboot-luns deckard-uboot-bootwrapper-luns
NoExtract = usr/share/help/* !usr/share/help/en*
NoExtract = usr/share/doc/*

# Valve overlay repo — must come before core/extra (first repo with a package wins)
[deckard-arch-hotfixes-release-0.4]
Server = https://steamdeck-packages.steamos.cloud/archlinux-deckard-hotfixes/release/0.4.x

[core]
Server = https://steamdeck-packages.steamos.cloud/archlinux-deckard/archlinux/mash-20240428.1/$repo/os/$arch

[extra]
Server = https://steamdeck-packages.steamos.cloud/archlinux-deckard/archlinux/mash-20240428.1/$repo/os/$arch
