# Kettle Linux initramfs: SteamOS's A/B boot (the holo hook: slot partitions, /var, the /etc
# overlay). Storage and filesystem drivers are built into the kernel. No plymouth hook: the
# splash starts from the root file system (packages/plymouth), as before there was an initramfs.
HOOKS=(base udev holo modconf keyboard block filesystems)
COMPRESSION=zstd
