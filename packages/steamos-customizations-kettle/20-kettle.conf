# Kettle Linux initramfs: SteamOS's A/B boot (the holo hook: slot partitions, /var, the /etc
# overlay). Storage and filesystem drivers are built into the kernel, and so is the display, so
# the boot splash (plymouth, Kettle's hook in packages/plymouth) starts right after udev.
HOOKS=(base udev plymouth holo modconf keyboard block filesystems)
COMPRESSION=zstd
