# Core files of games: kept on /home (/var/lib/systemd/coredump is offloaded there), compressed,
# and bounded, so a crashing game can't fill the card. A process bigger than ProcessSizeMax still
# gets its journal entry and kettle-crashd its report, without the core file.
[Coredump]
Storage=external
Compress=yes
ProcessSizeMax=2G
ExternalSizeMax=2G
MaxUse=2G
KeepFree=2G
