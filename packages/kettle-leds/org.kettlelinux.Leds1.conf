<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.kettlelinux.Leds1"/>
    <allow send_destination="org.kettlelinux.Leds1"/>
  </policy>
  <!-- And the Game Mode user, kettle (uid 1000): Decky starts Device Settings' backend as it,
       without supplementary groups. Get and Set only take the lights' color and mode. -->
  <policy user="kettle">
    <allow send_destination="org.kettlelinux.Leds1"/>
  </policy>
</busconfig>
