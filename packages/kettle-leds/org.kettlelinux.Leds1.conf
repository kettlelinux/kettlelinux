<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.kettlelinux.Leds1"/>
    <allow send_destination="org.kettlelinux.Leds1"/>
  </policy>
  <!-- Anyone may send, as for org.kettlelinux.Power1: Decky starts plugin backends as the user
       without supplementary groups. Get and Set only take the lights' color and mode. -->
  <policy context="default">
    <allow send_destination="org.kettlelinux.Leds1"/>
  </policy>
</busconfig>
