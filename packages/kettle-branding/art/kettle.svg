  <path d="M96 112 C104 102 152 102 160 112" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round"/>
  <rect x="118" y="88" width="20" height="16" rx="6" fill="url(#copper)"/>
  <!-- sheen -->
  <path d="M70 190 C70 156 88 130 112 122 C94 138 86 160 86 190 Z" fill="url(#sheen)"/>
  <!-- base -->
  <rect x="42" y="202" width="172" height="16" rx="8" fill="#d9502a"/>
