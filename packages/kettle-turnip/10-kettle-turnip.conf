<?xml version="1.0"?>
<!-- Valve's deckard-mesa 00-turnip-defaults.conf entries that upstream doesn't have, so a game
     switched to this driver keeps them. -->
<!DOCTYPE driconf [
    <!ENTITY VKD3D_APPLICATION_VERSION_ENGINE_UNREAL_ENGINE_5 "100000001">
    <!ENTITY VKD3D_APPLICATION_VERSION_ENGINE_UNREAL_ENGINE_UNKNOWN "100000002">
]>
<driconf>
    <device driver="turnip">
        <application name="all-default">
            <!-- 15/16 of RAM as the Vulkan heap, as Valve's -->
            <option name="heap_memory_percent" value="0.9375"/>
        </application>
        <!-- Many Unreal Engine 5 games require tu_enable_ssbo_emulation. Valve's has this as an
             <engine engine_name_match="vkd3d" application_versions=...>, which only their fork
             reads: upstream ignores application_versions on <engine>, and would apply it to
             every vkd3d game. vkd3d-proton reports the engine in applicationVersion, so match
             that on an <application>. -->
        <application name="Unreal Engine 5 through vkd3d-proton"
                     application_versions="&VKD3D_APPLICATION_VERSION_ENGINE_UNREAL_ENGINE_5;:&VKD3D_APPLICATION_VERSION_ENGINE_UNREAL_ENGINE_UNKNOWN;">
            <option name="tu_enable_ssbo_emulation" value="true" />
        </application>
        <application name="Beat Saber" executable="Beat Saber.exe">
            <option name="tu_autotune_algorithm" value="prefer_gmem" />
        </application>
        <application name="Sweet Surrender" executable="Sweet Surrender VR.exe">
            <option name="tu_autotune_algorithm" value="prefer_gmem" />
        </application>
    </device>
</driconf>
