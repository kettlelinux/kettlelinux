# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
# Kettle Linux: the Portal's pad as a Steam Deck controller. Sorts before upstream's
# 50-ayn_odin2.yaml (Xbox Elite target), which then finds the pad already in use.
# rsinput1 (upstream): the button below the right stick is Quick Access, and North/West are
# swapped back to the Xbox/Deck layout the kernel driver reports by position, and the back
# buttons (BTN_Z/BTN_C) are the left/right paddles.
version: 1
kind: CompositeDevice
name: AYN Odin 2 Portal (Kettle)

options:
  auto_manage: true

matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: compatible
          value: ayn,odin2portal*

source_devices:
  - group: gamepad
    capability_map_id: rsinput1
    evdev:
      name: AYN Odin2 Gamepad
      phys_path: rsinput-gamepad/input0
      vendor_id: "2020"
      product_id: "3001"
      handler: event*

  # the back buttons (M1/M2), a gpio-keys device from our dts emitting BTN_Z/BTN_C
  - group: gamepad
    capability_map_id: rsinput1
    evdev:
      name: gpio-keys-paddles
      handler: event*

target_devices:
  - deck
