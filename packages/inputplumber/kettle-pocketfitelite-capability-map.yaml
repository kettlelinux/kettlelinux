# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/capability_map_v2.json
# Kettle Linux: the KONKR Pocket FIT Elite's extra buttons on the Deck controller. Used by
# 40-kettle-pocketfitelite.yaml. The standard buttons, sticks, triggers and d-pad (a hat) pass
# through. The face buttons are Xbox-labelled (A bottom), as the driver reports them.
# Which physical button is which comes from ROCKNIX's konkr_gamepad/konkr_sysbtn maps; not yet
# checked on hardware. The two rear buttons send nothing (the MCU reports neither).
version: 2
kind: CapabilityMap
name: KONKR Pocket FIT Elite (Kettle)
id: kettle-pocketfitelite

mapping:
  # the KONKR key (konkr_sysbtn): Steam
  - name: KONKR Key
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_TRIGGER_HAPPY2
          value_type: button
    target_event:
      gamepad:
        button: Guide

  # the front top buttons: L5 (the gamepad's BTN_MODE, above the left stick) and R5, bindable in
  # Steam Input (Quick Access is on the button beside the KONKR key, as the user asked 2026-10-17)
  - name: Front Top Left
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_MODE
          value_type: button
    target_event:
      gamepad:
        button: LeftPaddle2

  # the extra shoulder buttons: L4/R4
  - name: Left Extra Shoulder
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_TRIGGER_HAPPY3
          value_type: button
    target_event:
      gamepad:
        button: LeftPaddle1

  - name: Right Extra Shoulder
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_TRIGGER_HAPPY4
          value_type: button
    target_event:
      gamepad:
        button: RightPaddle1

  - name: Front Top Right
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_TRIGGER_HAPPY5
          value_type: button
    target_event:
      gamepad:
        button: RightPaddle2

  # front bottom-right, beside the KONKR key (Steam): Quick Access
  - name: Front Bottom Right
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_TRIGGER_HAPPY1
          value_type: button
    target_event:
      gamepad:
        button: QuickAccess

filtered_events: []
