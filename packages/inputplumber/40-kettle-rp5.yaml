# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
# Kettle Linux: the Retroid Pocket 5's pad (the retroid-pocket-gamepad MCU driver) as a Steam Deck
# controller, as on the Portal. Sorts before upstream's 50-retroid_pocket5.yaml (Xbox Elite
# target), which then finds the pad already in use. kettle-rp5 (kettle-rp5-capability-map.yaml):
# upstream's ret1 map (the button below the right stick is Quick Access) with the face buttons
# mapped by their Nintendo-style labels, as on the Thor. Both panel revisions have the same
# compatible. The RP5 has no paddles.
version: 1
kind: CompositeDevice
name: Retroid Pocket 5 (Kettle)

options:
  auto_manage: true

matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: compatible
          value: retroidpocket,rp5*

source_devices:
  - group: gamepad
    capability_map_id: kettle-rp5
    evdev:
      name: Retroid Pocket Gamepad
      phys_path: retroid-pocket-gamepad/input0
      vendor_id: "2020"
      product_id: "3001"
      handler: event*

target_devices:
  - deck
