# kettle-powerd's description of the AYN Odin 2 Portal (QCS8550). Frequencies are the
# cpufreq-hw / GPU OPP tables read on the device; caps between steps round down.

[cpu]
# cpufreq policies, smallest cluster first. cpu0 can't be taken offline.
clusters = [
  { name = "little", policy = 0, cpus = [0, 1, 2] },
  { name = "mid", policy = 3, cpus = [3, 4, 5, 6] },
  { name = "prime", policy = 7, cpus = [7] },
]

[gpu]
devfreq = "/sys/devices/platform/soc@0/3d00000.gpu/devfreq/3d00000.gpu"
# busy percentage (kernel patch 40-kettle/1110)
load = "/sys/kernel/debug/dri/0/perf_now"
# lowest clock offered for a fixed (manual) GPU clock, MHz
manual_min_mhz = 220

[fan]
hwmon = "pwmfan"
cooling_device = "pwm-fan"
# Custom curves always run the fan at full speed from here, whatever the curve says (C)
full_speed_temp = 90
# The device tree curve (cooling-levels 0 30 45 60 70 90 120 150 of 255, one level per
# 5 C from 50 C), as percent: the starting point for a custom curve
default_curve = [[45, 0], [50, 12], [60, 24], [70, 35], [80, 59], [90, 100]]

[power]
battery = "battery"
charger = "qcom-battmgr-usb"
# Share of the charger's input power that reaches the system and battery
charger_efficiency = 0.9
# Steam's TDP slider: whole-device draw in watts (screen included); max means no limit
tdp_min = 4
tdp_max = 18
# The Portal's charger firmware ignores qcom_battmgr's charge limit request
# (BATTMGR_CHG_CTRL_LIMIT_EN times out, the threshold stays 0), but takes a charge current
# (constant_charge_current, kernel patch 40-kettle/1190). kettle-powerd holds Steam's charge
# limit with it: 0 at the limit, where the charger powers the system and the battery sits
# idle, and charging again 5% below. Steam's setting comes through remotes.d/kettle-power-charge.toml.
charge_limit = "current"
charge_limit_min = 55
# The firmware's own charge current, uA (BATT_CHG_CTRL_LIM at boot; the most it takes is 11.4 A):
# what charging returns to when kettle-powerd stops
charge_current = 8000000
# The Power plugin's charge speeds, the first the default. These cap what goes into the
# battery; a weaker charger gives it less than the cap.
charge_speed = [
  { name = "Fast", ua = 8000000 },
  { name = "Balanced", ua = 3000000 },
  { name = "Slow", ua = 1500000 },
]

# Steam's performance profiles (Quick Access > Performance). Caps in kHz / MHz; a cluster
# left out runs up to its highest frequency.
[[profile]]
name = "Performance"

[[profile]]
name = "Balanced"
little = 1785600
mid = 2323200
prime = 2476800
gpu_mhz = 615

[[profile]]
name = "Powersave"
little = 1459200
mid = 1785600
prime = 1843200
gpu_mhz = 475
