# Interfaces kettle-powerd implements for steamos-manager to relay to Steam
[TdpLimit1]
bus_name = "org.kettlelinux.Power1"
object_path = "/org/kettlelinux/Power1"

[PerformanceProfile1]
bus_name = "org.kettlelinux.Power1"
object_path = "/org/kettlelinux/Power1"

[GpuPerformanceLevel1]
bus_name = "org.kettlelinux.Power1"
object_path = "/org/kettlelinux/Power1"

# BatteryChargeLimit1 too, on devices with a charge limit: a remotes.d file in their overlay
# (device/odin2portal, device/thor, device/rp5)

[FanControl1]
bus_name = "org.kettlelinux.Power1"
object_path = "/org/kettlelinux/Power1"
