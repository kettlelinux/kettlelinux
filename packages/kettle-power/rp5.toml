# kettle-powerd's description of the Retroid Pocket 5 (SM8250, both panels: compatible
# "retroidpocket,rp5"). GPU frequencies are sm8250.dtsi's A650 OPP table with the overclock
# steps of kernel 21-sm8250/0111; the CPU caps are SM8250 cpufreq-hw steps, to check against
# the table read on the device (caps between steps round down).

[cpu]
# cpufreq policies, smallest cluster first. cpu0 can't be taken offline.
clusters = [
  { name = "little", policy = 0, cpus = [0, 1, 2, 3] },
  { name = "mid", policy = 4, cpus = [4, 5, 6] },
  { name = "prime", policy = 7, cpus = [7] },
]

[gpu]
devfreq = "/sys/devices/platform/soc@0/3d00000.gpu/devfreq/3d00000.gpu"
# busy percentage (kernel patch 40-kettle/1110). By device name, not dri/0: simpledrm takes
# minor 0 for the boot framebuffer, so msm is card1 here.
load = "/sys/kernel/debug/dri/ae01000.display-controller/perf_now"
# lowest clock offered for a fixed (manual) GPU clock, MHz
manual_min_mhz = 305
# highest clock in auto and for the TDP limit, MHz: 670, the SD870's stock top (in mainline's
# A650 table). Skyrim SE on battery, same spot: 587 MHz 23.5 fps at 5.8 W, GPU 62 C; 670 MHz
# 25.8 fps (+10%) at 6.8 W, GPU 67 C. Voting DDR's top level at 670 gained nothing. The
# overclock OPPs above it (kernel 21-sm8250/0111, to 750 MHz, with ACD from 0112) are only for
# a manual GPU clock, which Steam keeps per game. Tested in Cleared Hot on a charging RP5 with
# ACD: 700 MHz +10%, 750 MHz +11% fps, GPU at most 80 C (the passive trip is 85 C), no GPU
# errors; Skyrim SE at 750: +12% over 587, GPU 78 C.
auto_max_mhz = 670

[fan]
hwmon = "pwmfan"
cooling_device = "pwm-fan"
# Custom curves always run the fan at full speed from here, whatever the curve says (C)
full_speed_temp = 85
# The device tree curve (sm8250-pwm-fan-cooling.dtsi: cooling-levels 0 51 77 102 128 153 179
# 204 255 of 255, levels 1 2 3 4 6 8 at 45 55 62 68 73 78 C), as percent: the starting point
# for a custom curve
default_curve = [[40, 0], [45, 20], [55, 30], [62, 40], [68, 50], [73, 70], [78, 100]]

[power]
battery = "battery"
# the PM8150B charger (kernel patch 21-sm8250/0011). It reports online=16 when plugged in and
# input currents that look too low (seen on an RP5), so on the charger the draw falls back to
# the battery's reading
charger = "pm8150b-charger"
# Share of the charger's input power that reaches the system and battery
charger_efficiency = 0.9
# Steam's TDP slider: whole-device draw in watts (screen included); max means no limit
tdp_min = 3
tdp_max = 15
# The PM8150B has no charge end threshold. kettle-powerd holds Steam's charge limit with the
# charger's charge_behaviour (kernel patch 21-sm8250/0115): inhibit-charge at the limit, where
# the charger powers the system and the battery sits idle (0 mA on an RP5), and auto again 5%
# below. A fast-charge current of 0 isn't used: the battery then still gives ~200 mA. Steam's
# setting comes through remotes.d/kettle-power-charge.toml (device/rp5).
charge_limit = "inhibit"
charge_limit_min = 55
# The fast-charge current the RP5 boots with, uA (0x6b in 50 mA steps; the kernel's cap, from
# the battery's constant-charge-current-max-microamp): what charging returns to when
# kettle-powerd stops
charge_current = 5350000
# Device Settings' charge speeds, the first the default. These cap what goes into the
# battery; a weaker charger gives it less than the cap.
charge_speed = [
  { name = "Fast", ua = 5350000 },
  { name = "Balanced", ua = 3000000 },
  { name = "Slow", ua = 1500000 },
]

# Steam's performance profiles (Quick Access > Performance). Caps in kHz / MHz; a cluster
# left out runs up to its highest frequency.
[[profile]]
name = "Performance"

[[profile]]
name = "Balanced"
little = 1516800
mid = 2054400
prime = 2361600
gpu_mhz = 490

[[profile]]
name = "Powersave"
little = 1171200
mid = 1574400
prime = 1747200
gpu_mhz = 400
