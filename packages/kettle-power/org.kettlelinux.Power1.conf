<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.kettlelinux.Power1"/>
    <allow send_destination="org.kettlelinux.Power1"/>
  </policy>
  <!-- And the Game Mode user, kettle (uid 1000): its steamos-manager (a user service) relays
       Steam's power controls, Decky starts plugin backends as it (without supplementary groups,
       so a group policy wouldn't reach them), and the desktop's Power applet and Performance app
       run as it. Whatever is set, kettle-powerd runs the fan at full speed from 90 C. -->
  <policy user="kettle">
    <allow send_destination="org.kettlelinux.Power1"/>
  </policy>
</busconfig>
