<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.kettlelinux.Power1"/>
    <allow send_destination="org.kettlelinux.Power1"/>
  </policy>
  <!-- Anyone may send, as for com.steampowered.SteamOSManager1: Decky starts plugin backends
       as the user without supplementary groups, so a wheel policy doesn't reach the Power
       plugin. Whatever is set, kettle-powerd runs the fan at full speed from 90 C. -->
  <policy context="default">
    <allow send_destination="org.kettlelinux.Power1"/>
  </policy>
</busconfig>
