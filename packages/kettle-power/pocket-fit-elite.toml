# kettle-powerd's description of the KONKR Pocket FIT Elite (SM8750, Snapdragon 8 Elite).
# The sysfs paths and frequency tables are as read on a unit (2026-10-15); the charging figures were
# tested on it, and the TDP range and profiles come from a game run on it (Expedition 33,
# 2026-10-15, below). Caps between frequency steps round down.

[cpu]
# cpufreq policies (SCMI, the frequency table comes from the firmware), smallest cluster first:
# six Oryon cores (384 MHz - 3.53 GHz) and two prime cores (1.02 - 4.09 GHz on this unit's bin). cpu0 can't be taken offline. "prime" lets a game park
# both prime cores (Game Settings); the main cluster is never parked.
clusters = [
  { name = "main", policy = 0, cpus = [0, 1, 2, 3, 4, 5] },
  { name = "prime", policy = 6, cpus = [6, 7] },
]

[gpu]
devfreq = "/sys/devices/platform/soc@0/3d00000.gpu/devfreq/3d00000.gpu"
# busy percentage (kernel patch 40-kettle/1110). By device name, not dri/0: under an EFI boot
# simpledrm can take minor 0 for the boot framebuffer (as on the RP5)
load = "/sys/kernel/debug/dri/ae01000.display-controller/perf_now"
# lowest clock offered for a fixed (manual) GPU clock, MHz (the A830 runs 160-1100 MHz, all 14
# steps of sm8750.dtsi's table available on this unit's speed bin)
manual_min_mhz = 222

[fan]
hwmon = "pwmfan"
cooling_device = "pwm-fan"
# Custom curves always run the fan at full speed from here, whatever the curve says (C)
full_speed_temp = 90
# The device tree curve (sm8750-konkr-pf-elite-fan.dtsi: cooling levels 64/128/255 of 255 at
# 50/60/70 C), as percent: the starting point for a custom curve
default_curve = [[45, 0], [50, 25], [60, 50], [70, 100]]

[power]
battery = "battery"
charger = "qcom-battmgr-usb"
# Share of the charger's input power that reaches the system and battery
charger_efficiency = 0.9
# Steam's TDP slider: whole-device draw in watts (screen included); max means no limit.
# Measured in Expedition 33 (GPU-bound, GPU at 1100 MHz 95-99% busy, fan full): 15.4 W
# average, 20 W peak uncapped; 12 W at a 40 fps cap
tdp_min = 4
tdp_max = 22
# Charging, as tested on a unit (2026-10-15, 9 V PD charger): unlike the Portal's, this
# firmware takes qcom_battmgr's charge limit request. At an end threshold below the battery
# level it stops charging within seconds (the charger powers the system, the battery sits at
# 0 mA), and charging resumes when the threshold is raised again. So Steam's charge limit is
# the charger's end threshold (the default), held by the firmware even asleep or off, and
# Steam's setting comes through remotes.d/kettle-power-charge.toml (device overlay).
charge_limit_min = 55
# The firmware takes a charge current too (constant_charge_current, kernel patch 40-kettle/1190;
# 2 A gave 1.85 A into the battery, 0 stopped it, and raising it resumed at once at 85%).
# The firmware's own, uA (BATT_CHG_CTRL_LIM at boot, also its maximum): what charging returns
# to when kettle-powerd stops
charge_current = 8400000
# Device Settings' charge speeds, the first the default. These cap what goes into the
# battery; a weaker charger gives it less than the cap.
charge_speed = [
  { name = "Fast", ua = 8400000 },
  { name = "Balanced", ua = 3000000 },
  { name = "Slow", ua = 1500000 },
]

# Steam's performance profiles (Quick Access > Performance). Caps in kHz / MHz; a cluster
# left out runs up to its highest frequency. Steps of this unit's tables. Games here are
# GPU-bound: in Expedition 33 a 734 MHz GPU cap took ~28 fps down to ~20 (7.3 W against
# 12 W), so Balanced keeps 967 MHz, the highest step below the TURBO voltage levels, and
# saves on the CPU, whose prime cores reached 103 C uncapped.
[[profile]]
name = "Performance"

[[profile]]
name = "Balanced"
main = 2745600
prime = 3283200
gpu_mhz = 967

[[profile]]
name = "Powersave"
main = 1996800
prime = 2246400
gpu_mhz = 734
