# Each device's rotation from the Sensor Core's axes into kettle-motiond's layout (X right,
# Y toward the top edge, Z out of the screen, held in landscape): three rows of
# x1,x2,x3,y1,y2,y3,z1,z2,z3. The Sensor Core reports in Android's frame for the panel's
# natural orientation, portrait on these devices. A device is matched by the first of its
# device tree compatible strings that has a group here; without one the axes are kept.

# AYN Odin 2 Portal: tested in game, 2026-10-07
[ayn,odin2portal]
matrix=0,-1,0,1,0,0,0,0,1

# AYN Thor: the same rotation, tested in game, 2026-10-07
[ayn,thor]
matrix=0,-1,0,1,0,0,0,0,1
