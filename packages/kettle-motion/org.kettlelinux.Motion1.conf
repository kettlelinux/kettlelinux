<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.kettlelinux.Motion1"/>
    <allow send_destination="org.kettlelinux.Motion1"/>
  </policy>
  <!-- Anyone may send, as for org.kettlelinux.Leds1: Decky starts plugin backends as the user
       without supplementary groups. The methods only take the motion mode and whether a game
       runs. -->
  <policy context="default">
    <allow send_destination="org.kettlelinux.Motion1"/>
  </policy>
</busconfig>
