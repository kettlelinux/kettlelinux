# The KONKR Pocket FIT Elite (SM8750, Snapdragon 8 Elite), read by scripts/build-image.sh, which
# also installs it in the image as /usr/lib/kettle/device.conf. The image is the common overlay
# (device/common/overlay) with this device's overlay on top, and image/packages.txt plus this
# device's packages.txt. Written before the device arrived: see docs/POCKETFITELITE.md.

# os-release VARIANT (shown in Steam's About page and the update bundle's description)
MODEL="KONKR Pocket FIT Elite"
# devicetree, relative to /boot/dtbs (boot.conf's DTB): ROCKNIX's board dts
DTB=qcom/sm8750-konkr-pf-elite.dtb
# devicetrees appended to \KERNEL for the ROCKNIX ABL (its SM8750 build), which picks one by
# qcom,msm-id and qcom,board-id
ABL_DTBS="qcom/sm8750-*.dtb"
# which ROCKNIX ABL build the device takes (abl_signed-<ABL_SOC>.elf): kettle-abl-update keeps
# an installed one up to date (packages/rocknix-abl)
ABL_SOC=SM8750
# RAUC refuses a bundle whose compatible differs from the running system's: each device has its
# own. Never change it once Pocket FIT Elites run Kettle.
RAUC_COMPATIBLE=kettle-aarch64-pocketfitelite

# Read on the device too (/usr/lib/kettle/device.conf, through kettle_device.py):
# the built-in gamepad's input device name (desktop-controller, qam-button): the AYANEO MCU's
# SPI pad (kernel 22-sm8750/0058). The KONKR key and the extra buttons are a second device,
# "KONKR System Buttons" (0069), which InputPlumber joins to it in Game Mode.
PAD_NAME="AYANEO MCU Gamepad"
# how the face buttons are labelled: xbox (A bottom, B right, X left, Y top) or nintendo
# (A right, B bottom, X top, Y left); desktop-controller maps them by label
FACE_BUTTONS=xbox
