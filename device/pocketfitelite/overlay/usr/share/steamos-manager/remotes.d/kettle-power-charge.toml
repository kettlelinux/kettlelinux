# Steam's charge limit setting on the Pocket FIT Elite is kettle-powerd's: it sets the charger
# firmware's end threshold (packages/kettle-power/pocket-fit-elite.toml). steamos-manager merges
# this with remotes.d/kettle-power.toml; devices without a charge limit don't get this file.
[BatteryChargeLimit1]
bus_name = "org.kettlelinux.Power1"
object_path = "/org/kettlelinux/Power1"
