# The Pocket FIT Elite's Game Mode screen, read by gamescope-session: its panel (1080x1920
# portrait) is mounted rotated 90 degrees (dts rotation 90, the Portal's is 270), so gamescope
# turns it to 1920x1080 landscape. It is the only panel, so gamescope finds it without
# GAMESCOPE_OUTPUT. Not yet checked on hardware: if the picture is upside down, this is "left".
GAMESCOPE_ORIENTATION=right
# Steam picks Game Mode's UI scale from the panel's physical size: the panel driver reports the
# real 6" (132x74 mm), which makes the UI far too large. Report the Portal's panel size instead
# (same 1920x1080), so the UI is laid out as on the Portal (gamescope 0011), as on the RP5 and
# Thor. (Armada does the same with a 177x100 mm size.)
export GAMESCOPE_INTERNAL_PHYSICAL_SIZE=160x89
# The panel runs at one refresh rate, picked in Quick Access > Power: 60, 90, 120 or 144 Hz
# (refresh-rates lists them, the panel driver's modes, kernel 22-sm8750/0055). 120 Hz until one
# is picked, as on the Portal; all four share one pixel clock (the panel stretches its front
# porch), so a lower rate saves GPU work, not link power.
export gamescope_refresh_hz=120
# Auto in Quick Access > Power (refresh_hz 0) lets Steam's frame limit pick the rate. With no
# limit, or in the Steam UI, it stays at 120 (gamescope 0024).
export gamescope_auto_refresh_max_hz=120
