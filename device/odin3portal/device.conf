# The AYN Odin 3 Portal (CQ8725S, the Odin 3's board in a Portal-style body with a 7" AMOLED), read
# by scripts/build-image.sh, which also installs it in the image as /usr/lib/kettle/device.conf.
# The image is the common overlay (device/common/overlay) with this device's overlay on top, and
# image/packages.txt plus this device's packages.txt. See docs/ODIN3PORTAL.md.

# os-release VARIANT (shown in Steam's About page and the update bundle's description)
MODEL="AYN Odin 3 Portal"
# devicetree, relative to /boot/dtbs (boot.conf's DTB): our Odin 3 dts with Armada's Portal changes
DTB=qcom/cq8725s-ayn-odin3portal.dtb
# devicetrees appended to \KERNEL for the ABL (OpenABL's SM8750 build, which picks one by its
# Device model setting, the dtb's model "AYN Odin 3 Portal"). Only this board's, so whatever
# OpenABL picks, it is this one (the Odin 3's dtb would light the wrong panel)
ABL_DTBS="qcom/cq8725s-ayn-odin3portal.dtb"
# which ABL build the device takes (abl_signed-<ABL_SOC>.elf), as on the Odin 3: no loader
# partition, so the ABL is the only way in
ABL_SOC=SM8750
# RAUC refuses a bundle whose compatible differs from the running system's: each device has its
# own. Never change it once Odin 3 Portals run Kettle.
RAUC_COMPATIBLE=kettle-aarch64-odin3portal

# Read on the device too (/usr/lib/kettle/device.conf, through kettle_device.py):
# the built-in gamepad's input device name (desktop-controller, qam-button): the AYN MCU's UART
# pad (rsinput), named by the dts. The back buttons are a second device ("gpio-keys-paddles"),
# which InputPlumber joins to it in Game Mode
PAD_NAME="AYN Odin3 Portal Gamepad"
# how the face buttons are labelled: xbox (A bottom, B right, X left, Y top), as on the Odin 2
# Portal (AYN sells Nintendo-layout caps separately)
FACE_BUTTONS=xbox
# emulators: per-device defaults (internal resolution) of kettle-emulation; high or mid (default)
EMU_TIER=high
