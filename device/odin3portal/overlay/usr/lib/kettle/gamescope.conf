# The Odin 3 Portal's Game Mode screen, read by gamescope-session: its panel (VTDR6130, 1080x1920
# portrait) is mounted rotated 270 degrees (dts rotation 270, as on the Odin 2 Portal), so
# gamescope turns it to 1920x1080 landscape. It is the only panel, so gamescope finds it without
# GAMESCOPE_OUTPUT. Armada sets the same orientation for this board.
GAMESCOPE_ORIENTATION=left
# Steam picks Game Mode's UI scale from the panel's physical size: report the Odin 2 Portal's
# (the same 7" 1920x1080), so the UI is laid out as there (gamescope 0011).
export GAMESCOPE_INTERNAL_PHYSICAL_SIZE=160x89
# The panel runs at one refresh rate, 60 or 120 Hz (the panel driver's two modes, kernel
# 40-kettle/1470), picked in Quick Access > Power (refresh-rates lists them; gamescope 0023
# holds it, ~/.config/kettle/refresh-rate.conf keeps it). 120 Hz until one is picked.
export gamescope_refresh_hz=120
