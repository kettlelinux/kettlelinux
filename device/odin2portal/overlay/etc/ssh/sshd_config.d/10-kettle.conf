# Test image: password login for the kettle user, never root.
PermitRootLogin no
PasswordAuthentication yes
# Keys can also be installed per user in /etc/ssh/authorized_keys.d (a development image's
# SSH_PUBKEY goes there: /etc is kept across updates, /home is created on first boot)
AuthorizedKeysFile .ssh/authorized_keys /etc/ssh/authorized_keys.d/%u
