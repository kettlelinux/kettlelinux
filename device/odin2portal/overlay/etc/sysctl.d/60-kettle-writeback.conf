# Cap buffered writes. The default 20% of RAM (~3 GB here) lets Steam queue gigabytes for a
# slow microSD card; every fsync (journald, KDE, jbd2) then waits behind it and the desktop
# freezes. Small limits throttle the writer instead of the whole system. Sized for ~4 MB/s
# sustained small-file writes (a Proton update on a budget card): 48 MB clears in ~13 s.
vm.dirty_background_bytes = 16777216
vm.dirty_bytes = 50331648
