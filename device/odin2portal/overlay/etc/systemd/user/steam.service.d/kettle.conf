# Adapt Valve's deckard steam.service (Steam Frame) to a handheld Game Mode session.
[Unit]
After=gamescope-session.service

[Service]
# Valve's pre-start copies RUNSTEAM.sh into ~/.local/share/Steam, which does not exist
# before the first unpack: bootstrap first, then the same steps.
ExecStartPre=
ExecStartPre=/usr/lib/kettle/run-steam --bootstrap
ExecStartPre=/bin/bash -c "mkdir -p ${XDG_RUNTIME_DIR}/steam/env && cp -f /usr/share/deckard/steam_launch_wrapper_env_defaults.txt ${XDG_RUNTIME_DIR}/steam/env/gfx.txt"
ExecStartPre=-/usr/share/deckard/steam-health-check --track-started
# Valve's RUNSTEAM.sh passes -deckard -vrgamepadui; run-steam swaps in Steam Deck flags
ExecStart=
ExecStart=/usr/lib/kettle/run-steam
