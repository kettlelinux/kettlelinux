# Compressed swap in RAM (there is no swap otherwise). Steam, steamwebhelper and FEX-run
# games together outgrow RAM on the 8/12 GB Portals; zram keeps them running instead of
# OOM-killing, and never writes to the SD card. Sysctls: 60-kettle-zram.conf.
[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
swap-priority = 100
