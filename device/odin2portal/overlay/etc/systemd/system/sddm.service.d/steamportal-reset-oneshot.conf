# As on SteamOS: a Game/Desktop switch is a one-shot session choice; after a reboot SDDM
# goes back to the default login mode (also a failsafe if a switched-to session won't start).
[Service]
ExecStartPre=-rm -f /etc/sddm.conf.d/zzt-steamos-temp-login.conf
ExecStartPre=-rm -f /etc/sddm.conf.d/zzt-holo-temp-login.conf
