# SDDM for Steam Portal. Named to sort BEFORE steamos-manager's zz-holo-autologin.conf /
# zzt-holo-temp-login.conf, which choose the session when switching Game/Desktop mode.
[Autologin]
User=steamos
Relogin=true

# The greeter (shown after logout) runs on KWin/Wayland: no Xorg dependency.
[General]
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1

[Theme]
Current=breeze
