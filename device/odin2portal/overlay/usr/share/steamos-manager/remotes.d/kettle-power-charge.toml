# Steam's charge limit setting on the Portal is kettle-powerd's: it holds the limit
# through the charge current (packages/kettle-power/odin2portal.toml). steamos-manager merges
# this with remotes.d/kettle-power.toml; other devices' kettle-powerd has no charge limit to offer.
[BatteryChargeLimit1]
bus_name = "org.kettlelinux.Power1"
object_path = "/org/kettlelinux/Power1"
