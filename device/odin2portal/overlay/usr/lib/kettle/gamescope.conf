# The Portal's Game Mode screen, read by gamescope-session: its panel (1080x1920 portrait) is
# mounted rotated 270 degrees (dts rotation 270), so gamescope turns it to 1920x1080 landscape.
# It is the only panel, so gamescope finds it without GAMESCOPE_OUTPUT.
GAMESCOPE_ORIENTATION=left
# The refresh rate, picked in Quick Access > Power: Auto, or one of 50, 60, 120, 145 or 165 Hz
# (refresh-rates lists them, the panel driver's modes, kernel 40-kettle/1340), which gamescope 0023
# holds whatever Steam asks; ~/.config/kettle/refresh-rate.conf keeps the choice. Auto until one is
# picked: Steam's frame limit picks the rate, any of them (165 Hz for a 55 fps limit).
export gamescope_refresh_hz=0
# Auto with no frame limit: a game runs at 165 Hz (gamescope 0024), where it has a refresh to land on
# every 6 ms; the Steam UI, with no game open, at 120 (0021). 60 Hz saves about 0.14 W in the UI.
export gamescope_auto_refresh_max_hz=165 gamescope_ui_refresh_hz=120
# Steam only offers frame limits that divide a refresh rate: 164 and 144 Hz, run at the 165 and
# 145 Hz modes (gamescope 0026), add 82 and 72 fps (82.5 and 72.5 there)
export GAMESCOPE_REFRESH_RATE_ALIASES=164:165,144:145
