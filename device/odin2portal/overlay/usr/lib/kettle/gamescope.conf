# The Portal's Game Mode screen, read by gamescope-session: its panel (1080x1920 portrait) is
# mounted rotated 270 degrees (dts rotation 270), so gamescope turns it to 1920x1080 landscape.
# It is the only panel, so gamescope finds it without GAMESCOPE_OUTPUT.
GAMESCOPE_ORIENTATION=left
# The panel runs at one refresh rate, picked in Quick Access > Power: 50, 60, 100, 120, 145 or
# 165 Hz (refresh-rates lists them, the panel driver's modes, kernel 40-kettle/1340; gamescope 0023
# holds it, ~/.config/kettle/refresh-rate.conf keeps it). 60 Hz saves about 0.14 W in the Steam
# UI. 120 Hz, the rate AYN sells the panel at, until one is picked.
export gamescope_refresh_hz=120
