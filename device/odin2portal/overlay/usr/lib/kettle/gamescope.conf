# The Portal's Game Mode screen, read by gamescope-session: its panel (1080x1920 portrait) is
# mounted rotated 270 degrees (dts rotation 270), so gamescope turns it to 1920x1080 landscape.
# It is the only panel, so gamescope finds it without GAMESCOPE_OUTPUT.
GAMESCOPE_ORIENTATION=left
# The panel runs at 60 Hz while no game is open (gamescope 0021): the Steam UI idles at about
# 0.14 W less than at 120 Hz. Games still get 120 Hz, or 60 under a 30/60 fps cap (0020).
# For a 120 Hz Steam UI, set gamescope_ui_refresh_hz=0 in ~/.config/kettle/gamescope.conf.
export gamescope_ui_refresh_hz=60
