# Valve's deckard build targets the Steam Frame: it only runs next to steamvr.service and
# checks the VR headset model. On the Portal it runs with Game Mode instead
# (gamescope-session.target wants it) and stops with it, so the desktop keeps logind's handling.
[Unit]
Requisite=
PartOf=gamescope-session.target
After=gamescope-session.service

[Service]
ExecCondition=
