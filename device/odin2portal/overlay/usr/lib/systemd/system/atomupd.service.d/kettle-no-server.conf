# Kettle Linux: atomupd-daemon runs "steamos-atomupd-client" from its PATH; Kettle's wrapper
# comes first, so that an image without an update server reports "no update" instead of failing
# Steam's first-time setup (see /usr/lib/kettle/atomupd/steamos-atomupd-client).
[Service]
Environment=PATH=/usr/lib/kettle/atomupd:/usr/local/sbin:/usr/local/bin:/usr/bin
