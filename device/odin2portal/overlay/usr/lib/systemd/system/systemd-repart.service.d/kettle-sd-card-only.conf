# Kettle Linux: systemd-repart partitions the disk of the running system. That is only ever
# wanted on the SD card, where the first boot creates rootfs-B and /home (docs/UPDATES.md).
# An internal install shares its disk with Android: the Kettle Installer masks repart there, and
# this keeps it off even when that mask is gone (a factory reset clears /etc).
[Service]
ExecCondition=/bin/sh -c 'findmnt -no SOURCE / | grep -q "^/dev/mmcblk"'
