# lsfg-vk is an implicit Vulkan layer: without this it loads into every Vulkan client, including
# kwin and the whole desktop (GL runs on Vulkan through zink here), which caused pageflip
# timeouts and a frozen screen at login. Frame generation is opt-in per game: the Frame
# Generation plugin puts `env -u DISABLE_LSFGVK` in the launch options of games it's enabled for.
DISABLE_LSFGVK=1
