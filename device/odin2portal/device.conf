# The AYN Odin 2 Portal (QCS8550), read by scripts/build-image.sh, which also installs it in the
# image as /usr/lib/kettle/device.conf. The image is the common overlay (device/common/overlay)
# with this device's overlay on top, and image/packages.txt plus this device's packages.txt.

# os-release VARIANT (shown in Steam's About page and the update bundle's description)
MODEL="AYN Odin 2 Portal"
# devicetree, relative to /boot/dtbs (boot.conf's DTB)
DTB=qcom/qcs8550-ayn-odin2portal.dtb
# devicetrees appended to \KERNEL for the ROCKNIX ABL (boot.conf's ABL_DTBS): one ABL build
# serves one SoC, and its Device model setting picks among them
ABL_DTBS="qcom/qcs8550-*.dtb"
# RAUC refuses a bundle whose compatible differs from the running system's: each device has its
# own. The Portal keeps the one it had before there were other devices, so installed Portals
# still take updates.
RAUC_COMPATIBLE=kettle-aarch64

# Read on the device too (/usr/lib/kettle/device.conf, through kettle_device.py):
# the built-in gamepad's input device name (desktop-controller, qam-button)
PAD_NAME="AYN Odin2 Gamepad"
# how the face buttons are labelled: xbox (A bottom, B right, X left, Y top) or nintendo
# (A right, B bottom, X top, Y left); desktop-controller maps them by label
FACE_BUTTONS=xbox
