# The Retroid Pocket 5 (SM8250), read by scripts/build-image.sh, which also installs it in the
# image as /usr/lib/kettle/device.conf. The image is the common overlay (device/common/overlay)
# with this device's overlay on top, and image/packages.txt plus this device's packages.txt.

# os-release VARIANT (shown in Steam's About page and the update bundle's description)
MODEL="Retroid Pocket 5"
# devicetree, relative to /boot/dtbs (boot.conf's DTB): the original CH13726A panel
DTB=qcom/sm8250-retroidpocket-rp5.dtb
# the newer units' Visionox VTDR6130 panel, which nothing can detect before its driver runs: an
# empty file "visionox" (or visionox.txt) on the KETTLE partition picks this one (boot.conf)
DTB_ALT="visionox:qcom/sm8250-retroidpocket-rp5-visionox.dtb"
# devicetrees appended to \KERNEL for the ROCKNIX ABL (its SM8250 build; the Device model setting
# picks the panel)
ABL_DTBS="qcom/sm8250-retroidpocket-rp5*.dtb"
# which ROCKNIX ABL build the device takes (abl_signed-<ABL_SOC>.elf): kettle-abl-update keeps
# an installed one up to date (packages/rocknix-abl)
ABL_SOC=SM8250
# RAUC refuses a bundle whose compatible differs from the running system's: each device has its
# own. Never change it once RP5s run Kettle.
RAUC_COMPATIBLE=kettle-aarch64-rp5

# kernel options for this device only, added to boot.conf's CMDLINE. fw_devlink.sync_state=timeout:
# the GPU's GMU node never binds a driver (msm uses it directly), which keeps GCC and GPUCC
# from sync_state(); with it they sync after the deferred probe timeout
CMDLINE_EXTRA="fw_devlink.sync_state=timeout"

# Read on the device too (/usr/lib/kettle/device.conf, through kettle_device.py):
# the built-in gamepad's input device name (desktop-controller, qam-button)
PAD_NAME="Retroid Pocket Gamepad"
# how the face buttons are labelled: xbox (A bottom, B right, X left, Y top) or nintendo
# (A right, B bottom, X top, Y left); desktop-controller maps them by label
FACE_BUTTONS=nintendo
