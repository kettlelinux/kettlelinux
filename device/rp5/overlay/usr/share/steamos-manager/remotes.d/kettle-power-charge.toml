# Steam's charge limit setting on the RP5 is kettle-powerd's: it holds the limit through the
# charger's charge_behaviour (packages/kettle-power/rp5.toml). steamos-manager merges this with
# remotes.d/kettle-power.toml; devices without a charge limit don't get this file.
[BatteryChargeLimit1]
bus_name = "org.kettlelinux.Power1"
object_path = "/org/kettlelinux/Power1"
