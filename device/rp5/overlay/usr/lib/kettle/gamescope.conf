# The RP5's Game Mode screen, read by gamescope-session: its panel (1080x1920 portrait, either
# revision) is mounted rotated 270 degrees (dts rotation 270), so gamescope turns it to 1920x1080
# landscape. It is the only panel, so gamescope finds it without GAMESCOPE_OUTPUT.
GAMESCOPE_ORIENTATION=left
# Steam picks Game Mode's UI scale from the panel's physical size: the RP5's real 5.5" (121x68 mm)
# makes the UI far too large. Report the Portal's panel size instead (same 1920x1080), so the UI
# is laid out as on the Portal (gamescope 0011).
export GAMESCOPE_INTERNAL_PHYSICAL_SIZE=160x89
