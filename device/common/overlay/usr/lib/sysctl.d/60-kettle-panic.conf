# An oops leaves the handheld half dead: a lock held by the oopsed thread (the SM8750 audio clock
# driver after an ADSP restart held the clock prepare lock) stalls every later user, while
# systemd keeps the watchdog fed. Panic on oops instead, and reboot 10 s after a panic, so the
# handheld comes back by itself rather than waiting for a long press of the power button.
kernel.panic_on_oops = 1
kernel.panic = 10
# The same for a CPU stuck in the kernel (soft lockup: 20 s; hard lockup: a neighbour CPU sees its
# timer stop) and for a task stuck 120 s in uninterruptible sleep (behind such a lock, or a
# stalled bus), which otherwise leave the rest of the system running and the watchdog fed
kernel.softlockup_panic = 1
kernel.hardlockup_panic = 1
kernel.hung_task_panic = 1
