# Mesa's shader cache for everything outside Steam's own per-game caches (Heroic, Lutris, our
# Wine, emulators): its 1 GB default holds only a few DXVK/vkd3d games' shaders, so they evict
# each other and recompile, stuttering, on the next launch. A limit, not a reservation.
MESA_SHADER_CACHE_MAX_SIZE=4G
