# How this device boots Kettle Linux, read by update-grub (each slot's GRUB), by
# kettle-boot-legacy (the ABL's \KERNEL and U-Boot's extlinux) and by the image build.
# /etc/kettle/boot.conf, if present, is read after this and can change any of it.
#
# The root filesystem isn't named here: the initramfs finds the booted slot's partitions from
# steamos.efi=PARTUUID=<its efi partition>, which the bootloaders add. systemd.gpt_auto=0: the
# SteamOS partitions are mounted by the initramfs and its units, not by partition type.

# devicetree, relative to /boot/dtbs: the device's own, filled in by the image build from
# device/<device>/device.conf
DTB=@DTB@
# devicetrees for revisions of the device that nothing can tell apart before the kernel runs
# (the RP5's two panels), as NAME:DTB pairs: an empty file NAME or NAME.txt in the top folder of
# the KETTLE partition (the esp, partition 1) picks that DTB instead. GRUB checks at every boot,
# extlinux when kettle-boot-legacy writes it.
DTB_ALT="@DTB_ALT@"
# the devicetrees appended to \KERNEL for the ROCKNIX ABL (globs; its Device model setting
# picks one of them)
ABL_DTBS="@ABL_DTBS@"

CMDLINE="rootwait console=tty0 allow_mismatched_32bit_el0 fw_devlink.strict=1 pcie_ports=compat \
irqaffinity=0-2 nosoftlockup usbcore.interrupt_interval_override=045e:028e:2 \
ufshcd_core.uic_cmd_timeout=3000 mem_sleep_default=s2idle systemd.gpt_auto=0"

# the normal boot shows the splash (plymouth, Kettle theme) instead of kernel and systemd messages
SPLASH="quiet splash loglevel=3 vt.global_cursor_default=0 logo.nologo"
# the "verbose boot" entries keep the messages and skip plymouth
VERBOSE="plymouth.enable=0"
