# Kettle Linux: systemd-repart partitions the disk of the running system. On a handheld that is
# only ever wanted on the SD card, where the first boot creates rootfs-B and /home
# (docs/UPDATES.md). An internal install shares its disk with Android: the Kettle Installer masks
# repart there, and this keeps it off even when that mask is gone (a factory reset clears /etc).
# A machine whose disks are all Kettle's (REPART=disk in device.conf: a UEFI board booted from
# NVMe or USB) does it on whichever disk it booted from.
[Service]
ExecCondition=/bin/sh -c '. /usr/lib/kettle/device.conf; [ "$${REPART:-}" = disk ] || findmnt -no SOURCE / | grep -q "^/dev/mmcblk"'
