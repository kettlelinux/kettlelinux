# Kettle Linux: leave the splash's last frame on screen when plymouth quits (before SDDM), so
# the logo stays up until Game Mode (or the desktop) draws its own first frame instead of the
# screen going black in between; Game Mode then shows the logo itself until Steam is up
# (/usr/lib/kettle/gamescope-splash).
[Service]
ExecStart=
ExecStart=-/usr/bin/plymouth quit --retain-splash
