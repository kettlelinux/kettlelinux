# Adapt Valve's deckard steam.service (Steam Frame) to a handheld Game Mode session.
[Unit]
After=gamescope-session.service

[Service]
# Valve's pre-start copies RUNSTEAM.sh into ~/.local/share/Steam, which does not exist
# before the first unpack: bootstrap first, then the same steps.
ExecStartPre=
ExecStartPre=/usr/lib/kettle/run-steam --bootstrap
# Games run at LOW GPU priority (kettle-gpu-priority), so the Steam UI preempts them instead of
# waiting behind their frames: Quick Access over Skyrim (60 Hz, 60 fps limit) drew 16-49 fps,
# p95 33-49 ms; with it a steady 60, p95 17 ms. Raising the UI instead (TU_DEBUG=hiprio) froze
# the menus. gfx.txt is the games' environment, not Steam's.
# Valve's 4 GB VRAM report limit names the Frame's A750 (0x43051401) and the layer matches one
# exact ID, so on our GPUs it did nothing and games saw 15/16 of RAM as VRAM: put ours in its place.
ExecStartPre=/bin/bash -c "mkdir -p ${XDG_RUNTIME_DIR}/steam/env && cp -f /usr/share/deckard/steam_launch_wrapper_env_defaults.txt ${XDG_RUNTIME_DIR}/steam/env/gfx.txt && echo KETTLE_GAME_LOWPRIO=1 >>${XDG_RUNTIME_DIR}/steam/env/gfx.txt && { id=$$(/usr/lib/kettle/gpu-device-id) && sed -i 's/^VK_VRAM_REPORT_LIMIT_DEVICE_ID=.*/VK_VRAM_REPORT_LIMIT_DEVICE_ID='$$id/ ${XDG_RUNTIME_DIR}/steam/env/gfx.txt; true; }"
# Valve pins games to CPUs 3-7 (off the little cores); SoCs without little cores (the 8 Elite)
# give them all eight: game-cpu-affinity's lines, read for ExecStart after this pre-start step
# writes them, win over Valve's Environment=.
ExecStartPre=/bin/bash -c "mkdir -p ${XDG_RUNTIME_DIR}/steam && /usr/lib/kettle/game-cpu-affinity >${XDG_RUNTIME_DIR}/steam/affinity.env"
EnvironmentFile=-%t/steam/affinity.env
ExecStartPre=-/usr/share/deckard/steam-health-check --track-started
# Valve's RUNSTEAM.sh passes -deckard -vrgamepadui; run-steam swaps in Steam Deck flags
ExecStart=
ExecStart=/usr/lib/kettle/run-steam
