# Feed the hardware watchdog (the Gunyah hypervisor's on SM8550/SM8750, /dev/watchdog0): if the
# kernel hangs hard (a bus stall, every CPU stuck), nothing feeds it and the hypervisor resets
# the handheld. 30 s, under Gunyah's 32 s limit. Devices without a watchdog ignore this.
[Manager]
RuntimeWatchdogSec=30s
