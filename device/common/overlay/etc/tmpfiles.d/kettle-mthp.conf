# 64 KB transparent huge pages for anonymous memory: arm64 maps them with contiguous PTEs, so one
# TLB entry covers 16x more memory. On the Portal: random memory access +40%, 7-Zip +3.8%, faster
# shader compiles, Skyrim fps unchanged. 2 MB THP stays madvise-only (memory bloat, compaction stalls).
w- /sys/kernel/mm/transparent_hugepage/hugepages-64kB/enabled - - - - always
