# steamos-manager device config for the Retroid Pocket Nova. The power controls themselves
# (TDP, performance profiles, GPU clock, fan control) are kettle-powerd's, relayed through
# remotes.d/kettle-power.toml: configuring them here would make steamos-manager write the same
# cpufreq/devfreq files and fight it. Booted by the ROCKNIX ABL there is no SMBIOS, so it
# matches on the devicetree only. The charge limit stays with the firmware's end threshold
# (packages/kettle-power/rpnova.toml), so no remotes.d/kettle-power-charge.toml yet.
[[device]]
dt.compatible = "retroidpocket,rpnova"
device = "retroid_pocket_nova"
variant = "Nova"
friendly_name = "Retroid Pocket Nova"

# Steam lowers the TDP to this while it downloads in sleep; the rest of TdpLimit1 comes
# from kettle-powerd
[tdp_limit]
method = "remote_interface"
download_mode_limit = 5
