# Steam's charge limit setting on the Nova is kettle-powerd's: it holds the limit through the
# charge current (packages/kettle-power/rpnova.toml), as on the Portal and Thor. steamos-manager
# merges this with remotes.d/kettle-power.toml.
[BatteryChargeLimit1]
bus_name = "org.kettlelinux.Power1"
object_path = "/org/kettlelinux/Power1"
