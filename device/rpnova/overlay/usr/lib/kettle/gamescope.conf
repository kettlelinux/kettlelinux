# The Nova's Game Mode screen, read by gamescope-session: its panel (1280x960, 4:3) is
# landscape-native, the first Kettle device whose panel isn't mounted rotated (no dts rotation).
# It is the only panel, so gamescope finds it without GAMESCOPE_OUTPUT.
GAMESCOPE_ORIENTATION=normal
# Steam picks Game Mode's UI scale from the panel's physical size: the panel driver reports the
# real 4.5" (91x68 mm), which makes the UI far too large. Report the Steam Deck's pixel density
# instead (its 1280x800 over 151x94 mm), so the UI is laid out as on a Deck, 160 pixels taller.
export GAMESCOPE_INTERNAL_PHYSICAL_SIZE=151x113
# The panel runs at one refresh rate, picked in Quick Access > Power: 60 or 120 Hz
# (refresh-rates lists them, the panel driver's modes, kernel 20-sm8550/0105). 120 Hz until one
# is picked, as on the Portal. Not yet checked on a unit: the driver picks the panel's rate
# setup by guessing the mode, as the RP6's did before 20-sm8550/1021 left it one mode.
export gamescope_refresh_hz=120
# Auto in Quick Access > Power (refresh_hz 0) lets Steam's frame limit pick the rate. With no
# limit, or in the Steam UI, it stays at 120 (gamescope 0024).
export gamescope_auto_refresh_max_hz=120
