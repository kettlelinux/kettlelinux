# The Retroid Pocket Nova (QCS8550, 4:3 screen), read by scripts/build-image.sh, which also
# installs it in the image as /usr/lib/kettle/device.conf. The image is the common overlay
# (device/common/overlay) with this device's overlay on top, and image/packages.txt plus this
# device's packages.txt. Written before the device arrived: see docs/RPNOVA.md.

# os-release VARIANT (shown in Steam's About page and the update bundle's description)
MODEL="Retroid Pocket Nova"
# devicetree, relative to /boot/dtbs (boot.conf's DTB): ROCKNIX's, an overlay on its RP6 dts
DTB=qcom/qcs8550-retroidpocket-rpnova.dtb
# devicetrees appended to \KERNEL for the ROCKNIX ABL (boot.conf's ABL_DTBS): one ABL build
# serves one SoC, and its Device model setting picks among them
ABL_DTBS="qcom/qcs8550-*.dtb"
# which ROCKNIX ABL build the device takes (abl_signed-<ABL_SOC>.elf): kettle-abl-update installs
# and updates it (packages/rocknix-abl); MODEL ties its stock bootloader backups to this device
ABL_SOC=SM8550
# RAUC refuses a bundle whose compatible differs from the running system's: each device has its
# own. Never change it once Novas run Kettle.
RAUC_COMPATIBLE=kettle-aarch64-rpnova

# kernel options for this device only, added to boot.conf's CMDLINE. pcie_ports=compat came with
# ROCKNIX's SM8550 command line, as on the Portal and Thor (where dropping it didn't help sleep)
CMDLINE_EXTRA="pcie_ports=compat"

# Read on the device too (/usr/lib/kettle/device.conf, through kettle_device.py):
# the ADSP firmware kettle-adsp-firmware starts the ADSP with when the Nova's own can't be copied
# from its vendor partition (directory under /usr/lib/firmware; the dts and packages/kettle-motion)
ADSP_FIRMWARE_FALLBACK=qcom/sm8550/ayn/odin2
# the built-in gamepad's input device name (desktop-controller, qam-button): the same rsinput
# MCU driver as the AYN devices, under the same name (upstream InputPlumber's
# 50-retroid_pocket_nova.yaml matches it)
PAD_NAME="AYN Odin2 Gamepad"
# how the face buttons are labelled: xbox (A bottom, B right, X left, Y top) or nintendo
# (A right, B bottom, X top, Y left); desktop-controller maps them by label. Retroid's are
# Nintendo-style, as on the RP5 (checked on a unit)
FACE_BUTTONS=nintendo
