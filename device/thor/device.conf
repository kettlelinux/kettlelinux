# The AYN Thor (QCS8550, two screens), read by scripts/build-image.sh. The image is the common
# overlay (device/common/overlay) with this device's overlay on top, and image/packages.txt plus
# this device's packages.txt.

# os-release VARIANT (shown in Steam's About page and the update bundle's description)
MODEL="AYN Thor"
# devicetree, relative to /boot/dtbs (boot.conf's DTB)
DTB=qcom/qcs8550-ayn-thor.dtb
# RAUC refuses a bundle whose compatible differs from the running system's: a Portal bundle
# can't be installed on a Thor, nor the other way round
RAUC_COMPATIBLE=kettle-aarch64-thor
