# The Thor's Game Mode screen, read by gamescope-session: the top panel (ICNA3520, 1080x1920
# portrait, mounted the other way round from the Portal's: dts rotation 90, not 270). Game Mode
# runs on it alone; the bottom panel (CH13726A, 1080x1240) is the desktop's second screen.
GAMESCOPE_ORIENTATION=right
# The top panel is on DSI1 and the bottom one on DSI0, so the connectors are most likely DSI-2
# and DSI-1: pick the one that has the top panel's mode instead of relying on the order.
for c in /sys/class/drm/card*-DSI-*; do
  grep -qx 1080x1920 "$c/modes" 2>/dev/null && GAMESCOPE_OUTPUT=${c##*/card[0-9]-}
done
# Steam picks Game Mode's UI scale from the panel's physical size, and the top panel's driver
# reports 136x68 mm: Steam's UI came out too large, cut off at the edges. Report the Portal's
# panel size instead (same 1920x1080), so the UI is laid out as on the Portal (gamescope 0011).
export GAMESCOPE_INTERNAL_PHYSICAL_SIZE=160x89
