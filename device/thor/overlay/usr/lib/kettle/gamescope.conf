# The Thor's Game Mode screens, read by gamescope-session: Steam runs on the top panel
# (ICNA3520, 1080x1920 portrait, mounted the other way round from the Portal's: dts rotation 90,
# not 270). The bottom panel (CH13726A, 1080x1240, also rotation 90) is leased to its own
# gamescope, which runs a touch shell on it (kettle-bottom-screen.service); in the desktop it is
# the second screen.
GAMESCOPE_ORIENTATION=right
# The top panel is on DSI1 and the bottom one on DSI0, so the connectors are most likely DSI-2
# and DSI-1: pick them by their panels' modes instead of relying on the order.
for c in /sys/class/drm/card*-DSI-*; do
  grep -qx 1080x1920 "$c/modes" 2>/dev/null && GAMESCOPE_OUTPUT=${c##*/card[0-9]-}
  grep -qx 1080x1240 "$c/modes" 2>/dev/null && GAMESCOPE_LEASE_OUTPUT=${c##*/card[0-9]-}
done
GAMESCOPE_LEASE_TOUCH=bottom_touchscreen
GAMESCOPE_LEASE_ORIENTATION=right
# Steam picks Game Mode's UI scale from the panel's physical size, and the top panel's driver
# reports 136x68 mm: Steam's UI came out too large, cut off at the edges. Report the Portal's
# panel size instead (same 1920x1080), so the UI is laid out as on the Portal (gamescope 0011).
export GAMESCOPE_INTERNAL_PHYSICAL_SIZE=160x89
# The top panel runs at 60 Hz while no game is open (gamescope 0021), as on the Portal, where the
# Steam UI idles at about 0.14 W less than at 120 Hz. Games still get 120 Hz, or 60 under a 30/60
# fps cap (0020). For a 120 Hz Steam UI, set gamescope_ui_refresh_hz=0 in
# ~/.config/kettle/gamescope.conf.
export gamescope_ui_refresh_hz=60
