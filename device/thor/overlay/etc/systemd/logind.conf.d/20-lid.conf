# Closing the lid sleeps (logind's default HandleLidSwitch=suspend). logind ignores the lid for
# HoldoffTimeoutSec after boot and after every wake-up (30s by default, for laptop docks to
# settle): a lid closed soon after waking the Thor was ignored. It suspends once that's over if
# the lid is still closed.
[Login]
HoldoffTimeoutSec=5s
