# The Odin 3's Game Mode screen, read by gamescope-session: its panel (ICNA3520, 1080x1920
# portrait, the Thor's top panel) is mounted rotated 90 degrees (dts rotation 90, the Portal's is
# 270), so gamescope turns it to 1920x1080 landscape. It is the only panel, so gamescope finds it
# without GAMESCOPE_OUTPUT. Armada sets the same orientation for this board.
GAMESCOPE_ORIENTATION=right
# Steam picks Game Mode's UI scale from the panel's physical size; the ICNA3520's driver reports
# 136x68 mm on the Thor, which made the UI too large. Report the Portal's panel size instead
# (same 1920x1080), so the UI is laid out as on the Portal (gamescope 0011), as on the Thor.
export GAMESCOPE_INTERNAL_PHYSICAL_SIZE=160x89
# The panel runs at one refresh rate, 60 or 120 Hz (the ICNA3520's two modes, as on the Thor's
# top panel), picked in Quick Access > Power (refresh-rates lists them; gamescope 0023 holds it,
# ~/.config/kettle/refresh-rate.conf keeps it). 120 Hz until one is picked.
export gamescope_refresh_hz=120
