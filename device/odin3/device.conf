# The AYN Odin 3 (CQ8725S, AYN's Snapdragon 8 Elite / SM8750), read by scripts/build-image.sh,
# which also installs it in the image as /usr/lib/kettle/device.conf. The image is the common
# overlay (device/common/overlay) with this device's overlay on top, and image/packages.txt plus
# this device's packages.txt. See docs/ODIN3.md for what has been checked on hardware.

# os-release VARIANT (shown in Steam's About page and the update bundle's description)
MODEL="AYN Odin 3"
# devicetree, relative to /boot/dtbs (boot.conf's DTB): ROCKNIX's board dts
DTB=qcom/cq8725s-ayn-odin3.dtb
# devicetrees appended to \KERNEL for the ABL (OpenABL's SM8750 build, which picks one by its
# Device model setting: the dtb's model, "AYN Odin 3"). Only this board's: the Pocket FIT
# Elite's sm8750-*.dtb would be a second choice in the menu
ABL_DTBS="qcom/cq8725s-*.dtb"
# which ABL build the device takes (abl_signed-<ABL_SOC>.elf): kettle-abl-update installs and
# updates it. The Odin 3 has no loader partition (no AYN U-Boot), so the ABL is the only way in
ABL_SOC=SM8750
# RAUC refuses a bundle whose compatible differs from the running system's: each device has its
# own. Never change it once Odin 3s run Kettle.
RAUC_COMPATIBLE=kettle-aarch64-odin3

# Read on the device too (/usr/lib/kettle/device.conf, through kettle_device.py):
# the built-in gamepad's input device name (desktop-controller, qam-button): the AYN MCU's UART
# pad (rsinput, kernel 20-sm8550/0031), named by the dts. The back paddles M1/M2 are a second
# device ("gpio-keys-paddles"), which InputPlumber joins to it in Game Mode
PAD_NAME="AYN Odin3 Gamepad"
# how the face buttons are labelled: xbox (A bottom, B right, X left, Y top) or nintendo
# (A right, B bottom, X top, Y left); desktop-controller maps them by label
FACE_BUTTONS=nintendo
# emulators: per-device defaults (internal resolution) of kettle-emulation; high or mid (default)
EMU_TIER=high
