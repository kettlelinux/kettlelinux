# The Radxa Orion O6N (CIX P1 / CD8160 mini-ITX board), read by scripts/build-image.sh, which also
# installs it in the image as /usr/lib/kettle/device.conf. The image is the common overlay
# (device/common/overlay) with this device's overlay on top, and image/packages.txt plus this
# device's packages.txt. Kettle's first machine that is neither a handheld nor Qualcomm: a UEFI
# firmware with ACPI (no devicetree), a Mali GPU, HDMI/DP screens and external controllers. See
# docs/RADXA-O6N.md.

# os-release VARIANT (shown in Steam's About page and the update bundle's description)
MODEL="Radxa Orion O6N"
# the board's EDK2 firmware starts steamcl from \EFI\BOOT\BOOTAA64.EFI and describes the hardware
# with ACPI: no devicetree, no \KERNEL or extlinux
BOOT=uefi
# the CIX P1 kernel (kernel/cix: CIX's BSP series on 7.3)
KERNEL_FLAVOUR=cix
# RAUC refuses a bundle whose compatible differs from the running system's: each device has its
# own. Never change it once O6Ns run Kettle.
RAUC_COMPATIBLE=kettle-aarch64-radxa-o6n

# kernel options in place of the Qualcomm ones (boot.conf's CMDLINE_SOC). clk_ignore_unused: the
# kernel leaves on the clocks no driver claimed, which 06n-arch's images boot with and list as
# required on this board
CMDLINE_SOC="clk_ignore_unused"
# its disks are all Kettle's (NVMe, or the USB stick it was flashed to): the first boot makes
# rootfs-B and grows /home on whichever it booted from
REPART=disk

# Read on the device too (/usr/lib/kettle/device.conf):
# the CPUs games start on (game-cpu-affinity): all but the four Cortex-A520 little cores (CPUs
# 2-5; 0-1 and 6-11 are Cortex-A720), as Valve's 0xf8 keeps the Steam Frame's games off its
# little cores
GAME_CPU_AFFINITY=0xfc3
# no built-in gamepad (PAD_NAME): controllers come over USB or Bluetooth, and Steam takes them as
# they are; the volume-key confirmation (confirm-keys) has no keys to read here either
