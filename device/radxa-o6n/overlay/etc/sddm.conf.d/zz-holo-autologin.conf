# Default login session. steamos-manager rewrites this file when the start-up mode is changed
# (steamosctl set-default-login-mode, the Welcome pages in Game Mode and the desktop).
# The O6N starts in the Plasma desktop, as 06n-arch ran it: Game Mode (gamescope on linlondp and
# Panthor) black-screened on the first image (20261018.1). Game Mode is a switch away.
[Autologin]
Session=plasma.desktop
