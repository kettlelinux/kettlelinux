# The O6N's Game Mode screen, read by gamescope-session: whatever monitor or TV is plugged into its
# HDMI or DisplayPort (or USB-C DP) output, so no orientation, panel size or refresh rate of its
# own. gamescope takes the connected output and its EDID's preferred mode, and Steam's display
# settings pick another; nothing here overrides them.

# gamescope's own buffers without AFBC (Arm's compressed framebuffers): linlondp scanned out the
# AFBC ones PanVK gave gamescope with artifacts while anything moved (20261018.3). Only gamescope
# and what it starts (Xwayland, mangoapp) get it; Steam and games run as steam.service and keep
# AFBC for their own rendering.
export PAN_MESA_DEBUG=noafbc
