# The O6N's Game Mode screen, read by gamescope-session: whatever monitor or TV is plugged into its
# HDMI or DisplayPort (or USB-C DP) output, so no orientation, panel size or refresh rate of its
# own. gamescope takes the connected output and its EDID's preferred mode, and Steam's display
# settings pick another; nothing here overrides them.

# Every frame composited, never a client's buffer scanned out directly: Steam's and games' buffers
# are Panthor's own memory, which it maps cached on the O6N, and the display controller (linlondp)
# doesn't snoop, so stale cache lines showed as short dashes while anything moved. gamescope's own
# frames are the display controller's buffers (gamescope 0028), which Panthor maps uncached.
GAMESCOPE_EXTRA_ARGS="--force-composition"
